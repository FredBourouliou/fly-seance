[project]
name = "fly-seance"
version = "0.1.0"
description = "A séance with a simulated fruit-fly brain: the FlyWire connectome answers, a local Gemma model is the medium."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "brian2>=2.5",
    "numpy<2",
    "pandas>=2.0",
    "pyarrow>=14,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_seance"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
